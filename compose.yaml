name: smartfleet
services:
  database:
    image: postgres:18.6-alpine
    environment: &database-env
      POSTGRES_USER: smartfleet
      POSTGRES_DB: smartfleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python tools/setup_demo.py first}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U smartfleet -d smartfleet']
      interval: 5s
      timeout: 3s
      retries: 30
  db-init:
    image: postgres:18.6-alpine
    environment:
      <<: *database-env
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?}
      DEMO_MAINTENANCE_PASSWORD: ${DEMO_MAINTENANCE_PASSWORD:?}
    entrypoint: [sh, /deploy/init-db.sh]
    volumes:
      - ./Database:/database:ro
      - ./deploy:/deploy:ro
      - ./simulation/config:/simulation/config:ro
    depends_on:
      database: {condition: service_healthy}
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: [CMD, mosquitto_pub, -h, localhost, -t, health, -m, ready]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: {context: ., dockerfile: deploy/backend.Dockerfile}
    environment:
      ASPNETCORE_ENVIRONMENT: Simulation
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: '*'
      Hosting__UseHttpsRedirection: 'false'
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      ConnectionStrings__DefaultConnection: Host=database;Database=smartfleet;Username=smartfleet;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?}
      Jwt__Issuer: SmartFleet
      Jwt__Audience: SmartFleet.Web
      Mqtt__Host: mqtt
      Mqtt__Port: 1883
      Mqtt__EnableWorkers: 'true'
      AutoDispatch__EnableOnCreate: 'true'
      AutoDispatch__VerifiedPayloadLimitKg: 10
      Navigation__Enabled: 'true'
      Navigation__WarehouseId: 1
      DemoRoute__Enabled: 'true'
      DemoRoute__MetersPerGridCell: 0.5
      Simulation__Enabled: 'true'
      Simulation__ManifestPath: /simulation/config/scene-manifest.json
      Simulation__BridgeKey: ${SIMULATION_BRIDGE_KEY:?}
      Simulation__StreamUrl: ws://webots:1234
      Simulation__SecureCookies: ${SIMULATION_SECURE_COOKIES:-false}
    volumes:
      - backend-state:/app/App_Data
    depends_on:
      db-init: {condition: service_completed_successfully}
      mqtt: {condition: service_healthy}
  webots:
    init: true
    build: {context: ., dockerfile: deploy/simulation.Dockerfile}
    environment:
      # Portable CPU renderer: avoid the R2025a/LLVMpipe stall reproduced on QR8 -> QR7.
      # Keep device heartbeat/mission timeouts unchanged; do not mask a stopped simulator.
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: ${SIMULATION_RENDER_THREADS:-0}
      LP_NATIVE_VECTOR_WIDTH: '128'
      OPENCV_FOR_THREADS_NUM: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SMARTFLEET_MQTT_HOST: mqtt
      SMARTFLEET_BACKEND_URL: http://backend:8080
      SMARTFLEET_BRIDGE_KEY: ${SIMULATION_BRIDGE_KEY:?}
      SMARTFLEET_DIAGNOSTICS_DIR: ${SIMULATION_DIAGNOSTICS_DIR:-}
      SMARTFLEET_STATE_DIR: /state
    volumes:
      - simulator-state:/state
    shm_size: 512m
    stop_grace_period: 15s
    depends_on: [backend]
  web:
    build: {context: ., dockerfile: deploy/frontend.Dockerfile}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on: [backend]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/healthz]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  database:
  backend-state:
  simulator-state:
