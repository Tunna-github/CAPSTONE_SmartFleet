server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Re-resolve after Docker replaces a backend container; never retain its old IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $smartfleet_backend http://backend:8080;
    location = /healthz { proxy_pass $smartfleet_backend; }
    location /api/ {
        proxy_pass $smartfleet_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location /hubs/ {
        proxy_pass $smartfleet_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
